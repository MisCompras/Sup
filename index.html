<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Supermercado Pro</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
</head>
<body data-theme="light">
  
  <header class="topbar">
    <h1>Supermercado Pro</h1>
    <nav class="main-menu">
      <button id="btn-products" data-route="#products">🛒Adm Productos</button>
      <button id="btn-lists" data-route="#lists">📝List de Compras</button>
      <button id="btn-portal" class="btn-portal-secure">🌐Portal</button>
      <button id="btn-calculator-popup" class="btn-calc">🧮Calc</button>
    </nav>
    <button id="btn-settings" class="btn-calc" style="background: #64748b;" aria-label="Configuración">⚙️</button>
  </header>

  <main id="app"></main>

  <template id="template-products">
    <section class="page">
      <div class="page-header">
        <h2>🛒Administrar Productos</h2>
        <div class="page-actions">
          <button id="btn-add-product" class="btn">➕ Agregar Producto</button>
        </div>
      </div>

      <div class="controls-row">
        <div class="left-col">
          <div class="list-actions">
            <button id="btn-mod-prod" class="btn">✏️ Modificar Prod</button>
            <button id="btn-del-prod" class="btn danger">🗑️ Borrar Prod</button>
            <button id="btn-select-all-prod" class="btn secondary">🔲 Seleccionar Todo</button>
            <button id="btn-update-from-assets" class="btn warning">🔄 Actualizar desde Assets</button>
          </div>
          <ul id="product-list" class="item-list"></ul>
        </div>

        <div class="right-col">
          <div id="product-form-area"></div>
        </div>
      </div>
    </section>
  </template>

  <template id="template-lists">
    <section class="page page-gray">
      <div class="page-header">
        <h2>📝Listas de Compras&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span id="btn-scan-barcode-header" style="cursor:pointer">📷</span></h2>
        <div class="page-actions">
          <select id="lists-dropdown" class="select-list"></select>
          <button id="btn-new-list" class="btn">📝 Agregar Lista</button>
          <button id="btn-del-list" class="btn danger">🗑️ Borrar Lista</button>
        </div>
      </div>

      <div class="controls-row">
        <div class="right-col full-width">
          <div id="list-detail-area"></div>
        </div>
      </div>
    </section>
  </template>

  <template id="template-portal">
    <section class="page portal-page">
      <div class="page-header">
        <h2>🌐Portal</h2>
        <div class="page-actions">
            <button id="btn-close-portal" class="btn danger">🔒 Cerrar Sesión</button>
        </div>
      </div>
      
      <div class="portal-container">
        <div class="portal-sidebar">
            <h3>Accesos Rápidos</h3>
            <div id="portal-buttons-container" class="portal-grid">
                </div>
            <div class="portal-note">
                <small>Nota: Algunos sitios pueden bloquear la visualización. Si no carga, use la opción de apertura externa.</small>
            </div>
        </div>
        <div class="portal-viewer">
            <div id="portal-placeholder" class="portal-placeholder">
                <div class="placeholder-content">
                    <span style="font-size: 3rem;">🌐</span>
                    <p>Seleccione un sitio del menú para visualizarlo.</p>
                </div>
            </div>
            <iframe id="portal-frame" class="portal-frame hidden" src="" title="Portal Viewer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
        </div>
      </div>
    </section>
  </template>

  <input type="file" id="file-input" accept="application/json" style="display:none" />

  <div id="confirm-modal" class="modal hidden">
    <div class="modal-card">
      <div id="confirm-text"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
        <button id="confirm-cancel" class="btn secondary">❌ No</button>
        <button id="confirm-ok" class="btn">✅ Sí</button>
      </div>
    </div>
  </div>
  <div id="login-modal" class="modal hidden">
    <div class="modal-card" style="max-width: 350px;">
      <div class="modal-header">
        <h4>🛡️ Acceso Seguro</h4>
        <button id="close-login" class="btn-close">✖</button>
      </div>
      <div style="padding: 20px;">
        <div class="form-row" style="flex-direction: column; align-items: stretch;">
          <label>Usuario</label>
          <input type="text" id="login-user" placeholder="Ingrese usuario" autocomplete="username">
        </div>
        <div class="form-row" style="flex-direction: column; align-items: stretch;">
          <label>Contraseña</label>
          <input type="password" id="login-pass" placeholder="Ingrese contraseña" autocomplete="current-password">
        </div>
        <div style="margin-top: 20px; text-align: right;">
          <button id="btn-login-submit" class="btn success" style="width: 100%;">🔓 Ingresar</button>
        </div>
      </div>
    </div>
  </div>

  <div id="calculator-modal" class="modal hidden">
    <div class="calculator-popup">
      <div class="calculator-header">
        <h3>Calc</h3>
        <div class="calculator-controls">
          <div class="calculator-size-controls">
            <button class="size-btn" data-size="small">S</button>
            <button class="size-btn active" data-size="medium">M</button>
            <button class="size-btn" data-size="large">L</button>
          </div>
          <button id="close-calculator" class="btn-close">⏻ Apagar</button>
        </div>
      </div>
      <div class="calculator-display">
        <div class="operation-display"></div>
        <div class="result-display">0</div>
      </div>
      <div class="calculator-keypad">
        </div>
      <div class="calculator-actions">
        <button class="btn-save">💾 Guardar</button>
        <button class="btn-remove-last">🗑️ Borrar Último</button>
      </div>
      <div class="saved-results">
        <h4>📊 Resultados Guardados</h4>
        <div class="saved-values"></div>
      </div>
    </div>
  </div>

  <div id="settings-modal" class="modal hidden">
    <div class="modal-card">
      <div class="settings-header">
        <h3>Configuración General</h3>
        <button id="close-settings" class="btn-close">✖</button>
      </div>
      
      <div class="settings-section">
        <h4>🎨 Tema de la Aplicación</h4>
        <div class="setting-group" id="theme-selector">
          <button class="setting-btn" data-theme="light">Claro</button>
          <button class="setting-btn" data-theme="intermediate">Intermedio</button>
          <button class="setting-btn" data-theme="dark">Oscuro</button>
        </div>
      </div>

      <div class="settings-section">
        <h4>Abc Tamaño del Texto</h4>
        <div class="setting-group" id="font-size-selector">
          <button class="setting-btn" data-font-size="mini">Mini</button>
          <button class="setting-btn" data-font-size="small">Pequeño</button>
          <button class="setting-btn" data-font-size="medium">Mediano</button>
          <button class="setting-btn" data-font-size="large">Grande</button>
        </div>
      </div>

      <div class="settings-section">
        <h4>🔍 Escala de Interfaz</h4>
        <div class="setting-group" id="scale-selector">
          <button class="setting-btn active" data-scale="1">Normal (100%)</button>
          <button class="setting-btn" data-scale="0.9">Medio (90%)</button>
          <button class="setting-btn" data-scale="0.8">Pequeño (80%)</button>
        </div>
      </div>

      <div class="settings-section">
        <h4>💾 Gestión de Datos (Backup/Restore)</h4>
        <div class="setting-group vertical">
          <button id="btn-backup-prod" class="btn secondary">📦 Backup Productos</button>
          <button id="btn-restore-prod" class="btn secondary">🔄 Restaurar Productos</button>
          <button id="btn-backup-lists" class="btn secondary">📥 Backup Listas</button>
          <button id="btn-restore-lists" class="btn secondary">🔁 Restaurar Listas</button>
          <button id="btn-backup-all" class="btn secondary">💾 Backup Completo</button>
          <button id="btn-restore-all" class="btn secondary">🔄 Restaurar Completo</button>
        </div>
      </div>

    </div>
  </div>

  <div id="barcode-scanner-modal" class="modal hidden">
    <div class="modal-card" style="max-width: 640px; width: 100%; padding: 0;">
      <div class="modal-header">
        <h4>🔍 Escanear Código de Barras</h4>
        <button id="close-barcode-scanner" class="btn-close">✖</button>
      </div>
      <div id="scanner-container" style="position: relative; width: 100%; height: 320px; background: black; overflow: hidden;">
         <div id="interactive" class="viewport"></div>
         <div class="scanner-laser"></div>
      </div>
      <div style="padding: 16px; text-align: center; background: var(--card);">
        <p style="font-size: 0.9rem; color: var(--text-light);">Alinee el código de barras dentro de la ventana.</p>
        <button id="btn-stop-scan" class="btn danger" style="display:none;">Detener Cámara</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
